name: Create New Release

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new release and update the source feed
        type: boolean
        default: false
        required: true

permissions:
  contents: write

concurrency:
  group: korsign-public-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v3
        with:
          submodules: 'true'
      
      - name: Use Xcode 26.2
        run: |
          sudo xcode-select -s /Applications/Xcode_26.2.app/Contents/Developer
          xcodebuild -version
          test "$(xcodebuild -version | head -n 1)" = "Xcode 26.2"
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          echo "iPhoneOS SDK: $SDK_VERSION"
          test "${SDK_VERSION%%.*}" -ge 26

      - name: Check release validation
        run: |
          python3 tests/test_release_ipa.py
          python3 tests/test_package_ipa.py
          python3 tests/test_server_deps.py
          python3 tests/test_create_release.py
          ruby tests/test_release_workflow.rb
          python3 tests/test_self_update.py

      - name: Compile KorSign
        run: | 
          make

      - name: Validate and stage Main
        run: |
          python3 tools/validate_ipa.py packages/KorSign.ipa --deps deps --expected-build "$(sed -n 's/.*CURRENT_PROJECT_VERSION = \([0-9]*\);/\1/p' KorSign.xcodeproj/project.pbxproj | head -1)" > validation.json
          mkdir upload
          cp packages/KorSign.ipa upload/KorSign.ipa

      - name: Get Version
        id: get_version
        run: |
          VERSION=$(python3 -c 'import json; print(json.load(open("validation.json"))["version"])')
          echo "VERSION=${VERSION}" >> $GITHUB_ENV
          REVISION=$(python3 -c 'import json; print(json.load(open("validation.json"))["build"])')
          echo "REVISION=${REVISION}" >> $GITHUB_ENV

      - name: Create Release
        if: ${{ inputs.publish }}
        run: sh tools/create_release.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-feed:
    needs: build
    if: ${{ inputs.publish }}
    uses: ./.github/workflows/update_repo.yml
